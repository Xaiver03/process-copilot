name: test-and-deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ML tests
        run: make test-ml
      - name: API tests
        run: make test-api
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Web tests
        run: make test-web
      - name: Contracts lint
        run: pnpm lint:contracts
      - name: Infra checks
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: make infra-check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Deploy to wunoos
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 119.8.167.61
          username: root
          key: ${{ secrets.WUNOOS_DEPLOY_KEY }}
          script: |
            set -Eeuo pipefail
            bash /opt/process-copilot/current/infra/scripts/update.sh
      - name: Post-deploy smoke check
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 15 https://huagong.finlaw.cloud/healthz | grep -q '"ok"'; then
              echo "smoke ok"; exit 0
            fi
            sleep 10
          done
          echo "smoke check failed"; exit 1
