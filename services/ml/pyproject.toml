[project]
name = "process-copilot-ml"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pyarrow>=16,<25",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
process-copilot-ml = "process_copilot_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["process_copilot_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
