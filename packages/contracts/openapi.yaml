openapi: 3.1.0
info:
  title: Wuno Process Copilot API
  version: 0.1.0
  description: >-
    Public hackathon demo API for Tennessee Eastman Process simulation data.
    Replay controls and human decisions only affect isolated demo sessions; this
    contract is not an authenticated production control-plane API.
  license:
    name: Proprietary application; dataset retains its upstream license
    url: https://github.com/camaramm/tennessee-eastman-profBraatz/blob/master/LICENSE
security: []
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Check process liveness
      operationId: healthcheck
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          $ref: "#/components/responses/Problem"
  /readyz:
    get:
      summary: Check application readiness
      operationId: readiness
      responses:
        "200":
          description: Dependencies and demo data are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/scenarios:
    get:
      summary: List immutable demo scenarios
      operationId: listScenarios
      responses:
        "200":
          description: Available immutable demo scenarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scenario"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/environmental-scenarios:
    get:
      summary: >-
        List illustrative Xifeng phosphorus-coal park environmental scenarios
        (Xifeng park AI-enablement report, section 4.4-5). Synthetic data,
        kept separate from the TEP scenario catalog and its provenance guard.
      operationId: listEnvironmentalScenarios
      responses:
        "200":
          description: Available illustrative environmental scenarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnvironmentalScenario"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/environmental-scenarios/{scenarioId}:
    get:
      summary: Get an environmental scenario's telemetry and rule-based early warning
      operationId: getEnvironmentalScenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scenario metadata, telemetry series and early-warning result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentalScenarioDetail"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/capacity-plan/simulate:
    post:
      summary: >-
        Simulate feasible multi-unit production loads under a phosphogypsum
        consumption cap (the "gypsum-capped production" policy constraint,
        Xifeng park AI-enablement report section 3.2 / 4.4-6). Stateless
        rule-based calculator; no model is trained or called.
      operationId: simulateCapacityPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapacityPlanRequest"
      responses:
        "200":
          description: Feasible load combinations under the supplied gypsum cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapacityPlanResponse"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/runs:
    post:
      summary: Create a replay run
      operationId: createRun
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "201":
          description: Replay run created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayRun"
        "422":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/runs/{runId}:
    get:
      summary: Get current replay state
      operationId: getRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Current replay state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayRun"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/runs/{runId}/control:
    post:
      summary: Control replay state
      operationId: controlRun
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunControlRequest"
      responses:
        "200":
          description: Updated replay state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayRun"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/runs/{runId}/stream:
    get:
      summary: Stream replay telemetry and events
      operationId: streamRun
      x-sse-message-schema: "#/components/schemas/SSEMessage"
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: SSE stream with telemetry, anomaly and heartbeat events.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SSEMessage"
        "404":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/runs/{runId}/events:
    get:
      summary: List events for a replay run
      operationId: listRunEvents
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Events detected for the run.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnomalyEvent"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/events/{eventId}:
    get:
      summary: Get event diagnosis and evidence
      operationId: getEvent
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Diagnosis, evidence and recommendation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/events/{eventId}/ask:
    post:
      summary: Ask a question about an anomaly event
      operationId: askEvent
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskEventRequest"
      responses:
        "200":
          description: AI answer grounded in the event evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIAnswer"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/events/{eventId}/control-proposals:
    post:
      summary: Evaluate a human-edited action draft in read-only shadow mode
      operationId: createControlProposal
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateControlProposalRequest"
      responses:
        "201":
          description: Shadow evaluation recorded; no control command was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlProposal"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    get:
      summary: List durable shadow evaluations for an anomaly event
      operationId: listControlProposals
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Recorded shadow evaluations, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ControlProposal"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/events/{eventId}/decision:
    post:
      summary: Record a human decision
      operationId: decideEvent
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "201":
          description: Human decision and immutable record created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionRecord"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/login:
    post:
      summary: Authenticate a preset operator account
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Bearer token with operator identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/overview:
    get:
      summary: Get AI and worker operational overview
      operationId: getAdminOverview
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current inference, model, worker and data status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/ai/status:
    get:
      summary: Get online inference and AI status
      operationId: getAIStatus
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current AI runtime status without credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/ai/config:
    get:
      summary: Get language model configuration metadata
      operationId: getAIConfig
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Configuration with API key presence only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIConfig"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    put:
      summary: Update language model configuration
      operationId: updateAIConfig
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAIConfigRequest"
      responses:
        "200":
          description: Updated configuration metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIConfig"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/ai/test:
    post:
      summary: Test the configured language model connection
      operationId: testAIConnection
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIConnectionTestRequest"
      responses:
        "200":
          description: Deterministic connection test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIConnectionTestResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/ai/interactions:
    get:
      summary: List recorded AI interactions
      operationId: listAIInteractions
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated AI interaction records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIInteractionPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/audit:
    get:
      summary: List administrative configuration audit entries
      operationId: listAdminAudit
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated, secret-free audit records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/me:
    get:
      summary: Current operator identity
      operationId: me
      responses:
        "200":
          description: Authenticated operator identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorInfo"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/records/{recordId}:
    get:
      summary: Get an auditable decision record
      operationId: getRecord
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Auditable event decision record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionRecord"
        "404":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Request could not be completed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: string
    Scenario:
      type: object
      required: [id, name, faultId, sampleCount, faultOnsetSample, sourceLabel]
      properties:
        id: {type: string}
        name: {type: string}
        description:
          type: [string, "null"]
        faultId: {type: integer, minimum: 0, maximum: 21}
        sampleCount: {type: integer, minimum: 1}
        faultOnsetSample: {type: integer, minimum: 0}
        sourceLabel:
          const: Tennessee Eastman Process public simulation
    CreateRunRequest:
      type: object
      required: [scenarioId]
      properties:
        scenarioId: {type: string}
        speed: {type: number, enum: [1, 5, 10, 20], default: 10}
        inferenceMode: {type: string, enum: [online, template], default: template}
    ReplayRun:
      type: object
      required: [id, scenarioId, state, speed, currentSample, createdAt, inferenceMode, modelVersion]
      properties:
        id: {type: string, format: uuid}
        scenarioId: {type: string}
        state: {enum: [ready, playing, paused, completed, failed]}
        speed: {type: number}
        currentSample: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
        inferenceMode: {type: string, enum: [online, template]}
        modelVersion: {type: string}
    RunControlRequest:
      type: object
      required: [action]
      properties:
        action: {enum: [play, pause, restart, seek]}
        sampleIndex: {type: integer, minimum: 0}
        speed: {type: number, enum: [1, 5, 10, 20]}
    AnomalyEvent:
      type: object
      required: [id, runId, sampleIndex, severity, state, anomalyScore]
      properties:
        id: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        sampleIndex: {type: integer}
        severity: {enum: [warning, critical]}
        state: {enum: [open, confirmed, rejected, escalated, resolved]}
        anomalyScore: {type: number}
    FaultCandidate:
      type: object
      required: [faultId, label, probability]
      properties:
        faultId: {type: integer, minimum: 0, maximum: 21}
        label: {type: string}
        probability: {type: number, minimum: 0, maximum: 1}
    EvidenceItem:
      type: object
      required: [variableId, variableName, unit, contribution, direction, summary, values]
      properties:
        variableId:
          type: string
          pattern: '^(XMEAS|XMV)\([0-9]+\)$'
        variableName: {type: string}
        unit: {type: string}
        contribution: {type: number, minimum: 0}
        direction: {enum: [up, down, mixed]}
        summary: {type: string}
        values:
          type: array
          items: {type: number}
    Recommendation:
      type: object
      required: [mode, risk, checks, actions, safetyBoundary]
      properties:
        mode: {enum: [template, llm_enhanced, degraded]}
        risk: {type: string}
        checks:
          type: array
          items: {type: string}
        actions:
          type: array
          items: {type: string}
        safetyBoundary:
          const: Read-only advice. No automatic control write-back.
    EventDetail:
      allOf:
        - $ref: "#/components/schemas/AnomalyEvent"
        - type: object
          required:
            - detectionSample
            - diagnosisSample
            - diagnosisDelaySamples
            - diagnosisState
            - diagnosisAnomalyScore
            - anomalyLatched
            - initialCandidates
            - candidates
            - evidence
            - recommendation
            - modelVersion
            - dataSourceDisclosure
          properties:
            detectionSample:
              type: integer
              minimum: 0
              description: First sample where the anomaly event was latched.
            diagnosisSample:
              type: integer
              minimum: 0
              description: Sample used for the latest delayed candidate and evidence refresh.
            diagnosisDelaySamples:
              type: integer
              const: 20
              description: Pre-registered, label-independent delay after anomaly detection.
            diagnosisState:
              enum: [pending, provisional, updated]
            diagnosisAnomalyScore:
              type: number
            anomalyLatched:
              type: boolean
              const: true
            initialCandidates:
              type: array
              maxItems: 3
              items:
                $ref: "#/components/schemas/FaultCandidate"
            candidates:
              type: array
              maxItems: 3
              items:
                $ref: "#/components/schemas/FaultCandidate"
            evidence:
              type: array
              minItems: 3
              maxItems: 3
              items:
                $ref: "#/components/schemas/EvidenceItem"
            recommendation:
              $ref: "#/components/schemas/Recommendation"
            modelVersion: {type: string}
            dataSourceDisclosure:
              const: Public simulation data, not real Guizhou plant data.
    InferenceSnapshot:
      type: object
      required: [runId, sampleIndex, t2, spe, anomalyScore, alarmState, modelVersion, latencyMs]
      properties:
        runId: {type: string, format: uuid}
        sampleIndex: {type: integer, minimum: 0}
        t2: {type: number}
        spe: {type: number}
        anomalyScore: {type: number}
        alarmState: {type: string, enum: [normal, warning, critical]}
        modelVersion: {type: string}
        latencyMs: {type: number, minimum: 0}
    SSEMessage:
      type: object
      description: One JSON payload carried by the run text/event-stream response.
      required: [type, sequence, runId, emittedAt]
      properties:
        type:
          type: string
          enum: [state, inference, anomaly_opened, diagnosis_updated, completed, failed, heartbeat]
        sequence: {type: integer, minimum: 0}
        runId: {type: string, format: uuid}
        emittedAt: {type: string, format: date-time}
        sampleIndex: {type: integer, minimum: 0}
        state: {enum: [ready, playing, paused, completed, failed]}
        inference:
          $ref: "#/components/schemas/InferenceSnapshot"
        eventId: {type: string, format: uuid}
        diagnosisState: {enum: [pending, provisional, updated]}
        message: {type: string}
        errorCode: {type: string}
    AskEventRequest:
      type: object
      required: [question]
      properties:
        question: {type: string, minLength: 1, maxLength: 500}
    AIAnswer:
      type: object
      required: [answer, mode, model, evidenceRefs, latencyMs, traceId]
      properties:
        answer: {type: string}
        mode: {type: string, enum: [llm_enhanced, template, degraded]}
        model: {type: string}
        evidenceRefs:
          type: array
          items: {type: string}
        latencyMs: {type: number, minimum: 0}
        traceId: {type: string}
    ServiceStatus:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ready, degraded, offline, unknown]}
        version: {type: string}
        latencyMs: {type: number, minimum: 0}
        reason: {type: string}
    AIStatus:
      type: object
      required: [inferenceMode, worker, industrialModel, languageModel, dataBuildHash]
      properties:
        inferenceMode: {type: string, enum: [online, template]}
        worker:
          $ref: "#/components/schemas/ServiceStatus"
        industrialModel:
          $ref: "#/components/schemas/ServiceStatus"
        languageModel:
          $ref: "#/components/schemas/ServiceStatus"
        dataBuildHash: {type: string}
    AdminOverview:
      type: object
      required: [inferenceMode, worker, industrialModel, languageModel, dataBuildHash, recentLLMCalls, degradedReasons]
      properties:
        inferenceMode: {type: string, enum: [online, template]}
        worker:
          $ref: "#/components/schemas/ServiceStatus"
        industrialModel:
          $ref: "#/components/schemas/ServiceStatus"
        languageModel:
          $ref: "#/components/schemas/ServiceStatus"
        dataBuildHash: {type: string}
        recentLLMCalls:
          type: array
          items:
            $ref: "#/components/schemas/AIInteraction"
        degradedReasons:
          type: array
          items: {type: string}
    AIConfig:
      type: object
      required: [provider, baseUrl, model, enabled, timeoutMs, maxTokens, temperature, promptVersion, fallbackPolicy, apiKeyConfigured, version]
      properties:
        provider: {type: string}
        baseUrl: {type: string, format: uri}
        model: {type: string}
        enabled: {type: boolean}
        timeoutMs: {type: integer, minimum: 1, maximum: 120000}
        maxTokens: {type: integer, minimum: 1, maximum: 32768}
        temperature: {type: number, minimum: 0, maximum: 2}
        promptVersion: {type: string}
        fallbackPolicy: {type: string, enum: [template, degraded]}
        apiKeyConfigured: {type: boolean}
        version: {type: integer, minimum: 1}
    UpdateAIConfigRequest:
      type: object
      properties:
        provider: {type: string, minLength: 1}
        baseUrl: {type: string, format: uri}
        model: {type: string, minLength: 1}
        enabled: {type: boolean}
        timeoutMs: {type: integer, minimum: 1, maximum: 120000}
        maxTokens: {type: integer, minimum: 1, maximum: 32768}
        temperature: {type: number, minimum: 0, maximum: 2}
        promptVersion: {type: string, minLength: 1}
