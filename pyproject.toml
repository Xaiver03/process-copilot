[project]
name = "process-copilot-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["services/ml/tests", "apps/api/tests", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
