[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "process-copilot-api"
version = "0.1.0"
description = "FastAPI backend for the Wuno process copilot demo"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "PyJWT>=2.8,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["process_copilot_api"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra"
testpaths = ["tests"]
