[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "process-copilot-api"
version = "0.1.0"
description = "FastAPI backend for the Wuno process copilot demo"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.110,<1",
  "cryptography>=42,<47",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "PyJWT>=2.8,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
  "process-copilot-ml",
  "uvicorn[standard]>=0.30,<1",
]

[tool.uv.sources]
process-copilot-ml = { path = "../../services/ml" }

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["process_copilot_api"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra"
testpaths = ["tests"]
