name: ${COMPOSE_PROJECT_NAME:-process-copilot}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &default-hardening
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-process_copilot}:${POSTGRES_PASSWORD:-change_me_before_deploy}@postgres:5432/${POSTGRES_DB:-process_copilot}
  DEMO_DATA_DIR: ${DEMO_DATA_DIR:-/app/data/processed}
  MODEL_ARTIFACT_DIR: ${MODEL_ARTIFACT_DIR:-/app/data/processed/models}
  INFERENCE_MODE: ${INFERENCE_MODE:-online}
  LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://localhost}
  LLM_MODEL: ${LLM_MODEL:-not-configured}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-8}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-500}
  LLM_PROMPT_VERSION: ${LLM_PROMPT_VERSION:-event-copilot-v01}
  AI_CONFIG_ENCRYPTION_KEY: ${AI_CONFIG_ENCRYPTION_KEY:-}

services:
  caddy:
    image: caddy:2.9-alpine
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:8080}
    ports:
      - "${COPILOT_HTTP_PORT:-18090}:8080"
    expose:
      - "8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - edge
    <<: *default-hardening
    cap_add:
      - NET_BIND_SERVICE
    user: "1000:1000"
    logging: *default-logging
    tmpfs:
      - /config:size=16m,uid=1000,gid=1000,mode=0755
      - /data:size=64m,uid=1000,gid=1000,mode=0755
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    networks:
      - edge
    <<: *default-hardening
    logging: *default-logging
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=256m,uid=10001,gid=10001,mode=0755
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    expose:
      - "8000"
    environment: *api-environment
    volumes:
      - ../data/processed:/app/data/processed:ro
    networks:
      - edge
      - backend
    <<: *default-hardening
    logging: *default-logging
    tmpfs:
      - /tmp:size=128m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
        reservations:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    command: ["python", "-m", "process_copilot_api.worker"]
    environment: *api-environment
    volumes:
      - ../data/processed:/app/data/processed:ro
    networks:
      - backend
    <<: *default-hardening
    logging: *default-logging
    tmpfs:
      - /tmp:size=256m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-m", "process_copilot_api.worker", "--check"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-process_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_before_deploy}
      POSTGRES_DB: ${POSTGRES_DB:-process_copilot}
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /run/postgresql:size=16m,mode=0755
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    networks:
      - backend
    <<: *default-hardening
    logging: *default-logging
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: ${COMPOSE_PROJECT_NAME:-process-copilot}_pgdata

networks:
  edge:
  backend:
    internal: true
